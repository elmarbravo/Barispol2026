<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Centro Médico Barispol — Pediatria, Ginecologia, Ecografias | Luanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bsp-navy:#002060; --bsp-navy-d:#001340;
    --bsp-accent:#00A3E0; --bsp-accent-d:#0078A6;
    --bsp-bg:#F4F6FB; --bsp-surface:#FFFFFF; --bsp-surface2:#F1F4F9;
    --bsp-border:#E2E8F0; --bsp-text1:#0F172A; --bsp-text2:#475569; --bsp-text3:#94A3B8;
    --wa:#25D366; --wa-d:#1FA855;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Titillium Web",sans-serif;color:var(--bsp-text1)}
  button{font-family:inherit}

  /* Botões */
  .bsp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;transition:transform .16s,box-shadow .2s,background .18s;white-space:nowrap}
  .bsp-btn-sm{padding:9px 16px;font-size:13px}
  .bsp-btn:hover{transform:translateY(-2px)}
  .bsp-btn-primary{background:var(--bsp-navy);color:#fff;box-shadow:0 6px 18px rgba(0,32,96,.25)}
  .bsp-btn-accent{background:var(--bsp-accent);color:#fff;box-shadow:0 6px 18px rgba(0,163,224,.32)}
  .bsp-btn-wa{background:var(--wa);color:#fff;box-shadow:0 6px 18px rgba(37,211,102,.32)}
  .bsp-btn-ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);color:#fff;box-shadow:0 6px 18px rgba(221,42,123,.3)}
  .bsp-btn-ghostnavy{background:#fff;color:var(--bsp-navy);border:1.5px solid var(--bsp-border);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .bsp-btn-ghostnavy:hover{border-color:var(--bsp-accent)}
  .bsp-btn-wlight{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
  .bsp-btn-wlight:hover{background:rgba(255,255,255,.22)}
  .bsp-fullw{width:100%}

  /* Cartaz */
  .bsp-poster{cursor:pointer;box-shadow:0 10px 26px rgba(0,32,96,.18);transition:transform .2s,box-shadow .2s}
  .bsp-poster:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,32,96,.28)}
  .bsp-poster-cta{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#fff;
    padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);align-self:flex-start;transition:gap .18s,background .18s}
  .bsp-poster:hover .bsp-poster-cta{gap:11px;background:rgba(255,255,255,.26)}

  /* Chips filtro */
  .bsp-chip{border:1.5px solid var(--bsp-border);background:#fff;color:var(--bsp-text2);font-weight:700;font-size:13px;
    padding:8px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
  .bsp-chip[data-on="true"]{background:var(--bsp-navy);color:#fff;border-color:var(--bsp-navy)}

  /* Lista editorial (B) */
  .bsp-listrow{display:flex;align-items:flex-start;gap:13px;padding:14px;background:#fff;border:1px solid var(--bsp-border);
    border-radius:16px;cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s;text-align:left;width:100%;font-family:inherit}
  .bsp-listrow:hover{border-color:var(--bsp-accent);box-shadow:0 8px 22px rgba(0,32,96,.1);transform:translateY(-2px)}
  .bsp-listrow-ic{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .bsp-listrow-ic[data-tom="accent"]{background:linear-gradient(135deg,#00A3E0,#0078A6)}
  .bsp-listrow-ic[data-tom="navy"]{background:linear-gradient(135deg,#003088,#001340)}
  .bsp-listrow-ic[data-tom="soft"]{background:linear-gradient(135deg,#2BA0CF,#1F5FA8)}

  /* Post social (C) */
  .bsp-post{background:#fff;border:1px solid var(--bsp-border);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(0,32,96,.08);transition:transform .2s,box-shadow .2s}
  .bsp-post:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,32,96,.14)}
  .bsp-strip::-webkit-scrollbar{height:8px}
  .bsp-strip::-webkit-scrollbar-thumb{background:rgba(0,32,96,.18);border-radius:8px}
  .bsp-strip::-webkit-scrollbar-track{background:transparent}

  /* Portal hub (A) */
  .bsp-hubcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:26px;
    backdrop-filter:blur(10px);transition:transform .2s,border-color .2s,background .2s;cursor:pointer}
  .bsp-hubcard:hover{transform:translateY(-5px);border-color:rgba(0,163,224,.6);background:rgba(255,255,255,.1)}

  /* Portal split (B) */
  .bsp-accessrow{display:flex;align-items:center;gap:16px;padding:18px;background:#fff;border:1.5px solid var(--bsp-border);
    border-radius:16px;cursor:pointer;transition:all .16s;font-family:inherit;width:100%}
  .bsp-accessrow:hover{border-color:var(--bsp-accent);box-shadow:0 10px 26px rgba(0,32,96,.1);transform:translateY(-2px)}

  /* Portal minimal (C) */
  .bsp-minicard{display:flex;align-items:center;gap:18px;padding:22px;background:#fff;border:1px solid var(--bsp-border);
    border-radius:18px;cursor:pointer;transition:all .18s;font-family:inherit;width:100%;box-shadow:0 4px 14px rgba(0,32,96,.05)}
  .bsp-minicard:hover{border-color:var(--bsp-accent);box-shadow:0 14px 32px rgba(0,32,96,.12);transform:translateY(-3px)}
  .bsp-minicard-go{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--bsp-surface2);color:var(--bsp-navy);transition:background .18s,color .18s}
  .bsp-minicard:hover .bsp-minicard-go{background:var(--bsp-accent);color:#fff}

  /* Pílula 'Área Reservada' no navbar */
  .bsp-reserved-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--bsp-navy);
    padding:8px 14px;border-radius:999px;border:1.5px solid var(--bsp-border);cursor:pointer;transition:all .15s}
  .bsp-reserved-pill:hover{border-color:var(--bsp-navy);background:var(--bsp-surface2)}

  /* ── Gestor de Conteúdo (CMS) ── */
  .bsp-input{width:100%;font-family:inherit;font-size:14px;color:var(--bsp-text1);background:#fff;
    border:1.5px solid var(--bsp-border);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s;resize:vertical}
  .bsp-input:focus{border-color:var(--bsp-accent);box-shadow:0 0 0 3px rgba(0,163,224,.15)}
  .bsp-input::placeholder{color:var(--bsp-text3)}
  .bsp-seg{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:13px;font-weight:700;
    padding:10px;border-radius:10px;cursor:pointer;border:1.5px solid var(--bsp-border);background:#fff;color:var(--bsp-text2);transition:all .15s}
  .bsp-seg[data-on="true"]{background:var(--bsp-navy);color:#fff;border-color:var(--bsp-navy)}
  .bsp-cmsrow{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#fff;border:1px solid var(--bsp-border);
    border-radius:12px;transition:border-color .15s,box-shadow .15s}
  .bsp-cmsrow[data-active="true"]{border-color:var(--bsp-accent);box-shadow:0 0 0 3px rgba(0,163,224,.12)}
  .bsp-cmsrow-tom{width:5px;align-self:stretch;border-radius:3px;flex:none}
  .bsp-cmsrow-tom[data-tom="accent"]{background:#00A3E0}
  .bsp-cmsrow-tom[data-tom="navy"]{background:#002060}
  .bsp-cmsrow-tom[data-tom="soft"]{background:#2BA0CF}
  .bsp-iconbtn{width:32px;height:32px;flex:none;border-radius:9px;border:1px solid var(--bsp-border);background:#fff;color:var(--bsp-text2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .15s;font-family:inherit}
  .bsp-iconbtn:hover{background:var(--bsp-surface2);color:var(--bsp-navy);border-color:var(--bsp-navy)}
  .bsp-iconbtn[data-danger]:hover{background:#FEF2F2;color:#DC2626;border-color:#DC2626}

  /* ════ SITE PÚBLICO ════ */
  .site-wrap{max-width:1140px;margin:0 auto;padding:0 28px}
  .site-nav{position:sticky;top:0;z-index:40}
  .site-topbar{background:var(--bsp-navy-d);padding:7px 0}
  .site-topbar-in{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.72)}
  .site-topbar-in a{color:rgba(255,255,255,.86);text-decoration:none}
  .site-topbar-in a:hover{color:#fff}
  .live-dot{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sep{color:rgba(255,255,255,.25)}
  .site-navbar{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,32,96,.08);box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .site-navbar-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 0}
  .site-logo-btn{background:none;border:none;cursor:pointer;padding:0}
  .site-links{display:flex;gap:6px}
  .site-link{background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--bsp-text2);padding:8px 12px;border-radius:8px;transition:all .15s}
  .site-link:hover{color:var(--bsp-navy);background:var(--bsp-surface2)}
  .site-nav-actions{display:flex;align-items:center;gap:10px}
  .site-reserved{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:700;color:var(--bsp-text3);background:none;border:none;cursor:pointer;padding:8px 6px;transition:color .15s}
  .site-reserved:hover{color:var(--bsp-navy)}
  @media(max-width:1024px){.site-links{display:none}}

  .site-hero{position:relative;min-height:600px;display:flex;align-items:center;overflow:hidden;background:var(--bsp-navy-d)}
  .site-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
  .site-hero-overlay{position:absolute;inset:0;background:linear-gradient(105deg,rgba(0,19,64,.97) 0%,rgba(0,19,64,.82) 55%,rgba(0,163,224,.2) 100%)}
  .site-hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:64px 0}
  @media(max-width:980px){.site-hero-grid{grid-template-columns:1fr}.site-hero-imgwrap{display:none}}
  .site-hero-copy h1{font-size:clamp(34px,4.4vw,52px);color:#fff;font-weight:700;line-height:1.1;margin:0 0 18px}
  .site-hero-copy h1 em{color:var(--bsp-accent);font-style:normal;display:block}
  .site-hero-copy p{font-size:17px;color:rgba(255,255,255,.75);margin:0 0 26px;line-height:1.6;max-width:460px}
  .site-hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.9);font-size:12px;font-weight:600;padding:6px 15px;border-radius:50px;margin-bottom:22px;text-transform:uppercase;letter-spacing:.05em}
  .site-hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .site-hero-loc{display:flex;align-items:center;gap:7px;font-size:13px;color:rgba(255,255,255,.6);margin:0}
  .site-hero-imgwrap{position:relative}
  .site-hero-stat{position:absolute;top:-14px;right:-12px;background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 12px 30px rgba(0,0,0,.25);text-align:center;z-index:3}
  .site-hero-stat strong{display:block;font-size:24px;font-weight:700;color:var(--bsp-accent-d)}
  .site-hero-stat span{font-size:11px;color:var(--bsp-text3);font-weight:600}
  .site-hero-img{border-radius:18px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.4);aspect-ratio:4/5;position:relative}
  .site-hero-img img{width:100%;height:100%;object-fit:cover}
  .site-hero-card{position:absolute;bottom:18px;left:18px;right:18px;background:rgba(0,19,64,.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 16px;color:#fff}
  .site-hero-card strong{display:block;font-size:15px;margin-bottom:3px}
  .site-hero-card span{font-size:12.5px;color:rgba(255,255,255,.75)}

  .site-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--bsp-border)}
  .site-stat{padding:30px 20px;text-align:center;transition:background .18s}
  .site-stat:hover{background:var(--bsp-surface2)}
  .site-stat:not(:last-child){border-right:1px solid var(--bsp-border)}
  .site-stat strong{display:block;font-size:clamp(22px,3vw,32px);font-weight:700;color:var(--bsp-accent-d);line-height:1;margin-bottom:7px}
  .site-stat-l{font-size:13.5px;color:var(--bsp-text2);line-height:1.3}
  .site-stat-l small{display:block;font-size:11px;color:var(--bsp-text3);margin-top:3px}

  .site-svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:34px}
  @media(max-width:820px){.site-svc-grid{grid-template-columns:1fr}}
  .site-svc{border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;color:#fff;transition:transform .22s,box-shadow .22s}
  .site-svc:hover{transform:translateY(-6px);box-shadow:0 25px 50px -12px rgba(0,32,96,.3)}
  .site-svc-ic{width:52px;height:52px;background:rgba(255,255,255,.16);border-radius:12px;display:flex;align-items:center;justify-content:center}
  .site-svc h3{font-size:19px;font-weight:700;color:#fff;margin:0}
  .site-svc p{font-size:14px;color:rgba(255,255,255,.82);line-height:1.55;flex:1;margin:0}
  .site-svc-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:50px;text-decoration:none;transition:all .18s}
  .site-svc-btn:hover{background:rgba(255,255,255,.26);gap:11px}
  .site-other-head{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bsp-text3);margin-bottom:16px}
  .site-other-head span{flex:1;height:1px;background:var(--bsp-border)}
  .site-other-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:820px){.site-other-grid{grid-template-columns:repeat(2,1fr)}}
  .site-other{background:#fff;border:1px solid var(--bsp-border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:all .22s}
  .site-other:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,32,96,.1);border-color:var(--bsp-accent)}
  .site-other h4{font-size:14.5px;font-weight:700;color:var(--bsp-navy);margin:0}
  .site-other .bsp-btn{align-self:flex-start}

  .site-why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:980px){.site-why-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.site-why-grid{grid-template-columns:1fr}}
  .site-why{display:flex;align-items:flex-start;gap:15px;padding:22px;background:var(--bsp-surface2);border-radius:14px;border:1px solid transparent;transition:all .22s}
  .site-why:hover{border-color:var(--bsp-accent);transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,32,96,.1)}
  .site-why-ic{width:46px;height:46px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bsp-navy),var(--bsp-accent))}
  .site-why strong{display:block;color:var(--bsp-navy);font-size:14.5px;margin-bottom:4px}
  .site-why span{font-size:13px;color:var(--bsp-text2);line-height:1.55}

  .site-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media(max-width:820px){.site-steps{grid-template-columns:1fr}}
  .site-step{text-align:center;padding:32px 26px;background:var(--bsp-surface2);border-radius:16px;border:1px solid var(--bsp-border);transition:all .22s}
  .site-step:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,32,96,.1);border-color:var(--bsp-accent)}
  .site-step-n{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--bsp-navy),var(--bsp-accent))}
  .site-step h4{font-size:16px;font-weight:700;color:var(--bsp-navy);margin:0 0 8px}
  .site-step p{font-size:13.5px;color:var(--bsp-text2);line-height:1.55;margin:0}

  .site-seg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:980px){.site-seg-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:620px){.site-seg-grid{grid-template-columns:repeat(2,1fr)}}
  .site-seg{display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid var(--bsp-border);border-radius:12px;padding:18px 12px;font-size:13px;font-weight:600;color:var(--bsp-navy);min-height:64px;transition:all .2s}
  .site-seg:hover{box-shadow:0 10px 20px rgba(0,32,96,.08);border-color:rgba(0,163,224,.5);transform:translateY(-2px)}

  .site-faq{background:#fff;border:1px solid var(--bsp-border);border-radius:14px;padding:0 22px;transition:box-shadow .2s}
  .site-faq[open]{box-shadow:0 6px 16px rgba(0,32,96,.08)}
  .site-faq summary{padding:18px 0;font-size:15px;font-weight:700;color:var(--bsp-navy);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .site-faq summary::-webkit-details-marker{display:none}
  .site-faq-chev{font-size:13px;color:var(--bsp-text3);transition:transform .2s}
  .site-faq[open] .site-faq-chev{transform:rotate(180deg)}
  .site-faq-a{padding:0 0 18px;font-size:14px;color:var(--bsp-text2);line-height:1.6}

  .site-loc{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
  @media(max-width:820px){.site-loc{grid-template-columns:1fr}}
  .site-loc-list{display:flex;flex-direction:column;gap:20px}
  .site-loc-item{display:flex;gap:14px;align-items:flex-start}
  .site-loc-ic{width:44px;height:44px;flex:none;background:#fff;border:1px solid var(--bsp-border);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--bsp-accent-d)}
  .site-loc-item strong{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bsp-navy);margin-bottom:5px}
  .site-loc-item>div>span{font-size:14px;color:var(--bsp-text2);display:block;line-height:1.5}
  .site-loc-badge{display:inline-flex!important;align-items:center;gap:6px;background:rgba(0,163,224,.1);border:1px solid rgba(0,163,224,.25);border-radius:10px;padding:6px 12px;font-size:12px!important;color:var(--bsp-navy)!important;font-weight:600;margin-top:8px}
  .site-map{border-radius:18px;overflow:hidden;min-height:300px;background:linear-gradient(150deg,#003088,#001340);display:flex;align-items:center;justify-content:center;position:relative}
  .site-map::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 30% 40%,rgba(0,163,224,.3),transparent 50%);opacity:.6}
  .site-map-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-align:center}
  .site-map-inner>span{font-size:15px;font-weight:600}
  .site-map-inner .bsp-btn{margin-top:6px}

  .site-footer{background:var(--bsp-navy-d);color:#fff;padding:60px 0 28px}
  .site-foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:44px;margin-bottom:40px}
  @media(max-width:820px){.site-foot-grid{grid-template-columns:1fr}}
  .site-footer p{font-size:14px;color:rgba(255,255,255,.7);line-height:1.6;margin:0 0 8px}
  .site-footer h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.4);font-weight:700;margin:0 0 14px}
  .site-foot-link{display:block;background:none;border:none;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.7);font-size:14px;padding:5px 0;text-align:left;transition:color .15s}

  .login-meta-ic{width:44px;height:44px;flex:none;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
  .login-meta-t{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;margin-bottom:3px}
  .login-meta-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7DD3FC;background:rgba(0,163,224,.2);padding:2px 7px;border-radius:6px}
  .login-meta-d{display:block;font-size:12px;color:rgba(255,255,255,.72);line-height:1.4}
  .login-or{display:flex;align-items:center;gap:12px;max-width:380px;margin:0 0 18px;color:var(--bsp-text3);font-size:12px;font-weight:600}
  .login-or::before,.login-or::after{content:'';flex:1;height:1px;background:var(--bsp-border)}

  /* ===== MOBILE ===== */
  @media(max-width:640px){
    .site-wrap{padding:0 16px}
    .site-topbar-in{font-size:10.5px;gap:6px;padding:0 12px}
    .site-topbar-in .sep{display:none}
    .site-navbar-in{padding:10px 0;gap:10px}
    .site-nav-actions{gap:6px}
    .site-reserved{font-size:0;padding:8px;gap:0}
    .site-reserved svg{width:18px;height:18px}
    .site-navbar-in .bsp-btn-sm{font-size:12px;padding:9px 13px}
    /* hero */
    .site-hero{min-height:auto}
    .site-hero-grid{padding:36px 0;gap:28px}
    .site-hero-copy h1{font-size:30px}
    .site-hero-copy p{font-size:15px}
    .site-hero-btns{flex-direction:column;align-items:stretch}
    .site-hero-btns .bsp-btn{width:100%}
    .site-hero-badge{font-size:11px}
    /* generic sections */
    #servicos,#confianca,#como-marcar,#seguros,#faq,#localizacao,#inquerito{padding:48px 0 !important}
    /* stats: 1 col stack */
    .site-stats{grid-template-columns:1fr}
    .site-stat:not(:last-child){border-right:none;border-bottom:1px solid var(--bsp-border)}
    /* campaigns (inline padding overrides) */
    .campc{padding:40px 0 !important}
    .campc-head{padding:0 16px !important;gap:14px}
    .bsp-strip{padding:4px 16px 14px !important}
    /* videos */
    #videos{padding:48px 0 !important}
    .site-videos{gap:18px}
    .site-video-frame-v{max-height:460px}
    /* survey */
    .survey-embed-card{margin:0}
    .survey-embed-head{flex-wrap:wrap;gap:10px}
    .survey-embed-open{order:3}
    /* faq / loc */
    .site-loc{gap:26px}
    .site-map{min-height:260px}
    /* footer */
    .site-foot-grid{gap:28px}
    /* floats: compact WA */
    .site-float-wa span{display:none}
    .site-float-wa{width:56px;height:56px;justify-content:center;padding:0}
    .site-floats{bottom:16px;right:16px;gap:10px}
    /* portal / login */
    .portal-screen{grid-template-columns:1fr}
    .portal-brand{padding:26px 18px;gap:22px}
    .portal-brand h2{font-size:26px}
    .portal-list-panel{padding:26px 18px}
    .login-meta,.login-or,.portal-list-panel form,.login-demo{max-width:100%}
    .login-demo-grid{grid-template-columns:1fr}
    .portal-dest{padding:15px}
    .portal-dest-ic{width:46px;height:46px}
    /* admin */
    .gestor-topnav{padding:12px 16px;gap:10px}
    .admin-rolesel{max-width:130px}
    .pw-modal{padding:22px}
  }
  @media(max-width:380px){
    .site-hero-copy h1{font-size:26px}
    .portal-brand h2{font-size:23px}
  }
</style>
</head>

  );
}

/* ───────── Store de conteúdo (persistente, sem código) ───────── */
const STORE_KEY = 'bsp_campaigns_v1';
const _subs = new Set();
function getCampaigns(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return DEFAULT_CAMPAIGNS;
}
function setCampaigns(list){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch(e){}
  _subs.forEach(fn => fn());
}
function resetCampaigns(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  _subs.forEach(fn => fn());
}
function useCampaigns(){
  const [list, setList] = React.useState(getCampaigns);
  React.useEffect(() => {
    const fn = () => setList(getCampaigns());
    _subs.add(fn);
    return () => _subs.delete(fn);
  }, []);
  return list;
}

function ContentManager(){
  const live = useCampaigns();
  const [draft, setDraft] = React.useState(emptyDraft);
  const [editingId, setEditingId] = React.useState(null);
  const [flash, setFlash] = React.useState('');
  const set = (k) => (e) => setDraft(d => ({ ...d, [k]: e.target ? e.target.value : e }));

  const flashMsg = (m) => { setFlash(m); setTimeout(() => setFlash(''), 1800); };

  function salvar(){
    if (!draft.titulo.trim()){ flashMsg('Falta o título'); return; }
    const list = getCampaigns();

/* ───────── bsp-auth.jsx — Autenticação + gestão de acessos ─────────
   PROTÓTIPO: login e utilizadores guardados no navegador (localStorage).
   Na implementação real, isto liga a um backend seguro (a palavra-passe
   NUNCA fica no browser). Aqui serve para demonstrar o fluxo e os perfis.
*/

/* Perfis e o que cada um pode abrir. 'admin' = também gere utilizadores. */
const ROLES = {
  admin:     { label: 'Administrador (TI)', perms: ['meta','work','cms','survey','admin'] },
  gestor:    { label: 'Gestor / Coordenação', perms: ['meta','work','cms','survey'] },
  rececao:   { label: 'Receção',            perms: ['meta'] },
  clinico:   { label: 'Clínico (Médico/Enfermagem)', perms: ['work'] },
  marketing: { label: 'Marketing',          perms: ['cms','survey','work'] },
  visitante: { label: 'Visitante',          perms: ['work'] },
};

/* Contas iniciais. Geríveis em Gestão de Acessos (guardado no navegador). */
const DEFAULT_USERS = [
  { id: 'u1', nome: 'Elmar Bravo',     email: 'elmar.bravo@barispol.com',   pass: 'B@rispol2022', role: 'admin' },
  { id: 'u2', nome: 'Arlete Tatiana',  email: 'arlete.tatiana@barispol.com', pass: 'B@rispol2022', role: 'gestor' },
  { id: 'u3', nome: 'Visitante',       email: 'visitante@barispol.com',      pass: '12345678',     role: 'visitante' },
];

const USERS_KEY = 'bsp_users_v1';
const SESS_KEY  = 'bsp_session_v1';
const _usubs = new Set();
function getUsers(){ try { const r = localStorage.getItem(USERS_KEY); if (r) return JSON.parse(r); } catch(e){} return DEFAULT_USERS; }
function setUsers(list){ try { localStorage.setItem(USERS_KEY, JSON.stringify(list)); } catch(e){} _usubs.forEach(f => f()); }
function resetUsers(){ try { localStorage.removeItem(USERS_KEY); } catch(e){} _usubs.forEach(f => f()); }
function useUsers(){
  const [u, setU] = React.useState(getUsers);
  React.useEffect(() => { const f = () => setU(getUsers()); _usubs.add(f); return () => _usubs.delete(f); }, []);
  return u;
}
function getSession(){ try { const e = localStorage.getItem(SESS_KEY); if (!e) return null; return getUsers().find(u => u.email === e) || null; } catch(e){ return null; } }
function setSession(email){ try { email ? localStorage.setItem(SESS_KEY, email) : localStorage.removeItem(SESS_KEY); } catch(e){} }
function tryLogin(email, pass){
  const norm = email.trim().toLowerCase();
  let u = getUsers().find(x => x.email.toLowerCase() === norm);
  /* As contas oficiais funcionam sempre, mesmo com dados antigos no navegador. */
  if (!u || u.pass !== pass){ const d = DEFAULT_USERS.find(x => x.email.toLowerCase() === norm); if (d && d.pass === pass) u = d; }
  if (!u) return { ok: false, err: 'Email não encontrado.' };
  if (u.pass !== pass) return { ok: false, err: 'Palavra-passe incorreta.' };
  setSession(u.email);
  return { ok: true, user: u };
}
function can(user, perm){ return !!user && ROLES[user.role] && ROLES[user.role].perms.includes(perm); }

          </label>

    if (!draft.nome.trim() || !draft.email.trim()){ flashMsg('Preencha nome e email'); return; }
    if (getUsers().some(u => u.email.toLowerCase() === draft.email.trim().toLowerCase())){ flashMsg('Email já existe'); return; }

    setDraft({ nome: '', email: '', role: 'rececao', pass: '1234' });
    flashMsg('Colaborador adicionado ✓');

   • SurveySection  → secção pública no site (qualquer pessoa preenche)
   • SurveyResults  → painel interno com as respostas (atrás do login)

   isto envia para um backend / folha de cálculo.
*/
const SURVEY_KEY = 'bsp_surveys_v1';
const _ssubs = new Set();
function getSurveys(){ try { const r = localStorage.getItem(SURVEY_KEY); if (r) return JSON.parse(r); } catch(e){} return []; }
function addSurvey(resp){ const list = getSurveys(); list.unshift({ ...resp, id: 's'+Date.now(), data: new Date().toISOString() }); try { localStorage.setItem(SURVEY_KEY, JSON.stringify(list)); } catch(e){} _ssubs.forEach(f => f()); }
function clearSurveys(){ try { localStorage.removeItem(SURVEY_KEY); } catch(e){} _ssubs.forEach(f => f()); }
function useSurveys(){ const [l, setL] = React.useState(getSurveys); React.useEffect(() => { const f = () => setL(getSurveys()); _ssubs.add(f); return () => _ssubs.delete(f); }, []); return l; }

const SVC_OPTS = ['Pediatria','Ginecologia e Obstetrícia','Ecografias','Clínica Geral','Cardiologia','Análises Clínicas','Outro'];
const ASPECTS = [['atendimento','Atendimento da equipa'],['espera','Tempo de espera'],['limpeza','Limpeza e conforto'],['clareza','Clareza das explicações']];

function Stars({ value, onChange, size = 30, readOnly = false }){
  const [hover, setHover] = React.useState(0);
  return (
    <span style={{ display: 'inline-flex', gap: 4 }}>
      {[1,2,3,4,5].map(n => {
        const on = (hover || value) >= n;
        return (
          <button key={n} type="button" disabled={readOnly}
            onMouseEnter={() => !readOnly && setHover(n)} onMouseLeave={() => !readOnly && setHover(0)}
            onClick={() => !readOnly && onChange(n)}
            style={{ background: 'none', border: 'none', padding: 0, cursor: readOnly ? 'default' : 'pointer', lineHeight: 0 }} aria-label={n+' estrelas'}>
            <svg viewBox="0 0 24 24" width={size} height={size} fill={on ? '#F5A623' : 'none'} stroke={on ? '#F5A623' : 'var(--bsp-border)'} strokeWidth="1.6" strokeLinejoin="round" style={{ transition: 'all .12s' }}>
              <path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18.9 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>
            </svg>
          </button>
        );
      })}
    </span>
  );
}

function SurveyResults({ onBack }){
  const list = useSurveys();
  const n = list.length;
  const avg = n ? (list.reduce((a, r) => a + (r.geral || 0), 0) / n) : 0;
  const recSim = list.filter(r => r.recomenda === 'sim').length;
  const recPct = n ? Math.round(recSim / n * 100) : 0;
  const dist = [5,4,3,2,1].map(star => ({ star, c: list.filter(r => r.geral === star).length }));
  const aspAvg = ASPECTS.map(([k, l]) => {
    const vals = list.map(r => r.aspectos && r.aspectos[k]).filter(Boolean);
    return { l, v: vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0 };
  });
  const fmtDate = (iso) => { try { const d = new Date(iso); return d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }); } catch(e){ return ''; } };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bsp-bg)' }}>
      <div className="gestor-topnav">
        <button className="portal-back" style={{ color: 'var(--bsp-navy)', background: 'var(--bsp-surface2)', border: '1px solid var(--bsp-border)' }} onClick={onBack}><Ic.arrow s={15} style={{ transform: 'rotate(180deg)' }}/> Voltar ao portal</button>
        <span style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--bsp-navy)' }}>Respostas ao Inquérito</span>
        <span style={{ width: 140 }}/>
      </div>
      <div style={{ maxWidth: 1000, margin: '0 auto', padding: 32 }}>
        {/* KPIs */}
        <div className="sr-kpis">
          <div className="sr-kpi"><span className="sr-kpi-v">{n}</span><span className="sr-kpi-l">Respostas</span></div>
          <div className="sr-kpi"><span className="sr-kpi-v">{avg.toFixed(1)}<small> / 5</small></span><span className="sr-kpi-l">Média geral</span><Stars value={Math.round(avg)} readOnly size={15}/></div>
          <div className="sr-kpi"><span className="sr-kpi-v" style={{ color: recPct >= 70 ? 'var(--wa-d)' : 'var(--bsp-navy)' }}>{recPct}%</span><span className="sr-kpi-l">Recomendam</span></div>
        </div>

        {n === 0 ? (
          <div style={{ padding: 60, textAlign: 'center', color: 'var(--bsp-text3)', background: '#fff', border: '1px dashed var(--bsp-border)', borderRadius: 16, marginTop: 24 }}>
            Ainda não há respostas. Assim que alguém preencher o inquérito no site, aparece aqui.
          </div>
        ) : (
          <div className="sr-grid">
            {/* Distribuição + aspetos */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <div className="sr-panel">
                <div className="sr-panel-h">Distribuição das avaliações</div>
                {dist.map(({ star, c }) => (
                  <div key={star} className="sr-bar">
                    <span className="sr-bar-l">{star}★</span>
                    <span className="sr-bar-track"><span className="sr-bar-fill" style={{ width: (n ? c/n*100 : 0)+'%' }}/></span>
                    <span className="sr-bar-c">{c}</span>
                  </div>
                ))}
              </div>
              <div className="sr-panel">
                <div className="sr-panel-h">Média por aspeto</div>
                {aspAvg.map(a => (
                  <div key={a.l} className="sr-asp"><span>{a.l}</span><span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Stars value={Math.round(a.v)} readOnly size={15}/><b>{a.v ? a.v.toFixed(1) : '—'}</b></span></div>
                ))}
              </div>
            </div>
            {/* Lista de respostas */}
            <div className="sr-panel" style={{ display: 'flex', flexDirection: 'column' }}>
              <div className="sr-panel-h" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span>Respostas recentes</span>
                <button onClick={clearSurveys} className="bsp-chip" style={{ fontSize: 11.5 }}>Limpar</button>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 460, overflowY: 'auto' }}>
                {list.map(r => (
                  <div key={r.id} className="sr-resp">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <Stars value={r.geral} readOnly size={15}/>
                      <span style={{ fontSize: 11.5, color: 'var(--bsp-text3)' }}>{fmtDate(r.data)}</span>
                    </div>
                    {r.servico && <span className="sr-resp-svc">{r.servico}</span>}
                    {r.comentario && <p className="sr-resp-c">“{r.comentario}”</p>}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>
                      <span className="sr-resp-rec" data-rec={r.recomenda}>{({sim:'Recomenda',talvez:'Talvez',nao:'Não recomenda'})[r.recomenda] || ''}</span>
                      {(r.nome || r.contacto) && <span style={{ fontSize: 11.5, color: 'var(--bsp-text3)' }}>{r.nome}{r.nome && r.contacto ? ' · ' : ''}{r.contacto}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

        </div>
      </section>

      {/* STATS */}
      <div style={{ background: '#fff' }}><div className="site-wrap"><div className="site-stats">
        {[['10 000+','Pessoas Atendidas'],['10','Anos de Experiência','Fundada em 2016'],['98%','Satisfação dos Pacientes']].map((s,i) => (
          <div key={i} className="site-stat"><strong>{s[0]}</strong><div className="site-stat-l">{s[1]}{s[2] && <small>{s[2]}</small>}</div></div>
        ))}
      </div></div></div>

      {/* ESPECIALIDADES */}
      <Sec id="servicos" bg="var(--bsp-surface2)">
        <Head kicker="Especialidades" title="Escolha o serviço" sub="Serviços especializados com marcação simples e atendimento personalizado."/>
        <div className="site-svc-grid">
          {MAIN_SVCS.map(s => (
            <div key={s.nome} className="site-svc" style={{ background: s.g }}>
              <div className="site-svc-ic"><SvcIcon k={s.ic}/></div>
              <h3>{s.nome}</h3>
              <p>{s.desc}</p>
              <a href={waLink(s.nome)} target="_blank" rel="noopener" className="site-svc-btn">Marcar <Ic.arrow s={15}/></a>
            </div>
          ))}
        </div>
        <div className="site-other-head">Outras especialidades <span/></div>
        <div className="site-other-grid">
          {OTHER_SVCS.map(o => (
            <div key={o} className="site-other"><h4>{o}</h4><a href={waLink(o)} target="_blank" rel="noopener" className="bsp-btn bsp-btn-primary bsp-btn-sm">Marcar</a></div>
          ))}
        </div>
      </Sec>

      {/* PORQUÊ */}
      <Sec id="confianca" bg="#fff">
        <Head kicker="Porquê Barispol" title="Porquê escolher o Centro Médico Barispol?"/>
        <div className="site-why-grid">
          {WHY.map(([t,d,k]) => (
            <div key={t} className="site-why"><div className="site-why-ic"><WhyIcon k={k}/></div><div><strong>{t}</strong><span>{d}</span></div></div>
          ))}
        </div>
      </Sec>

      {/* CAMPANHAS (Direção C) */}
      <div id="campanhas"><CampaignsC heroImg={heroImg}/></div>

      {/* VÍDEOS */}
      <VideosSection/>

      {/* COMO MARCAR */}
      <Sec id="como-marcar" bg="#fff">
        <Head kicker="Processo simples" title="Como marcar?" sub="O processo é simples — 3 passos."/>
        <div className="site-steps">
          {[['1','Escolha o serviço','Pediatria, Ginecologia, Ecografias ou outra especialidade.'],['2','Envie mensagem no WhatsApp','Com o seu nome, data preferida e período.'],['3','Receba confirmação','A recepção confirma por chamada ou WhatsApp.']].map(([n,t,d]) => (
            <div key={n} className="site-step"><div className="site-step-n">{n}</div><h4>{t}</h4><p>{d}</p></div>
          ))}
        </div>
        <div style={{ textAlign: 'center', marginTop: 40 }}>
          <a href={waLink('[SERVIÇO]')} target="_blank" rel="noopener" className="bsp-btn bsp-btn-wa"><Ic.wa s={18}/> Marcar agora no WhatsApp</a>
        </div>
      </Sec>

      {/* SEGUROS */}
      <Sec id="seguros" bg="var(--bsp-surface2)">
        <Head kicker="Convénios" title="Seguros de Saúde Aceites" sub="Trabalhamos com as principais seguradoras de Angola para facilitar o seu acesso à saúde."/>
        <div className="site-seg-grid">
          {SEGUROS.map(s => <div key={s} className="site-seg">{s}</div>)}
        </div>
        <p style={{ textAlign: 'center', fontSize: 13, color: 'var(--bsp-text3)', marginTop: 26 }}>Não encontrou o seu seguro? <a href={`https://wa.me/${WA_NUM}`} target="_blank" rel="noopener" style={{ color: 'var(--bsp-accent-d)', fontWeight: 700 }}>Contacte-nos via WhatsApp</a> para confirmar.</p>
      </Sec>

      {/* FAQ */}
      <Sec id="faq" bg="#fff">
        <Head kicker="Perguntas Frequentes" title="Dúvidas frequentes" sub="Respostas rápidas sobre marcações, horários e serviços."/>
        <div style={{ maxWidth: 760, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {FAQ.map(([q,a]) => (
            <details key={q} className="site-faq"><summary>{q}<span className="site-faq-chev">▾</span></summary><div className="site-faq-a">{a}</div></details>
          ))}
        </div>
      </Sec>

      {/* INQUÉRITO DE SATISFAÇÃO */}
      <SurveySection/>

      {/* LOCALIZAÇÃO */}
      <Sec id="localizacao" bg="#fff">
        <Head kicker="Onde estamos" title="Localização" sub="Fácil acesso em Camama, Luanda."/>
        <div className="site-loc">
          <div className="site-loc-list">
            <div className="site-loc-item"><span className="site-loc-ic"><Ic.pin s={20}/></span><div><strong>Morada</strong><span>Bairro Bom Sossego, Casa 186, Camama, Luanda — Angola</span><span className="site-loc-badge"><Ic.pin s={13}/> Próximo ao Hospital Materno Infantil Azancot de Menezes</span></div></div>
            <div className="site-loc-item"><span className="site-loc-ic"><Ic.cal s={20}/></span><div><strong>Horário</strong><span>Todos os dias — 07:30 às 22:00</span></div></div>
            <div className="site-loc-item"><span className="site-loc-ic"><Ic.wa s={18}/></span><div><strong>Contactos</strong><span>+244 946 373 631 (Unitel) · +244 959 573 631 (Africell)</span><span>geral@barispol.com</span></div></div>
          </div>
          <div className="site-map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4731.565842052556!2d13.240734594442754!3d-8.948087790874064!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1a51f55580d6dcb1%3A0x63a13c8769359c83!2sCentro%20M%C3%A9dico%20Barispol!5e1!3m2!1spt-PT!2sao!4v1780528965943!5m2!1spt-PT!2sao" title="Mapa — Centro Médico Barispol" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, zIndex: 2 }} allowFullScreen loading="lazy" referrerPolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </Sec>

      {/* FOOTER */}
      <footer className="site-footer">
        <div className="site-wrap">
          <div className="site-foot-grid">
            <div>
              <BarispolLogo size={48} fs={18} mono/>
              <p style={{ marginTop: 16, maxWidth: 280 }}>Cuidado especializado para mães e crianças. Pediatria, Ginecologia, Obstetrícia e Ecografias em Camama, Luanda.</p>
              <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                <a href={IG_URL} target="_blank" rel="noopener" className="site-foot-soc"><Ic.insta s={18}/></a>
                <a href={`https://wa.me/${WA_NUM}`} target="_blank" rel="noopener" className="site-foot-soc"><Ic.wa s={18}/></a>
              </div>
            </div>
            <div>
              <h4>Navegação</h4>
              {[['inicio','Início'],['servicos','Especialidades'],['campanhas','Campanhas'],['videos','Vídeos'],['seguros','Seguros'],['inquerito','Inquérito'],['localizacao','Localização']].map(([id,l]) => <button key={id} className="site-foot-link" onClick={() => goTo(id)}>{l}</button>)}
            </div>
            <div>
              <h4>Contactos</h4>
              <p>Bairro Bom Sossego, Casa 186<br/>Camama, Luanda — Angola</p>
              <p>+244 946 373 631 (Unitel)<br/>+244 959 573 631 (Africell)</p>
              <p>geral@barispol.com</p>
              <p>Todos os dias · 07:30–22:00</p>
              <button className="site-foot-reserved" onClick={onReserved}><Ic.lock s={13}/> Área Reservada · Colaboradores</button>
            </div>
          </div>
          <div className="site-foot-bottom">
            <span>© 2026 Centro Médico Barispol. Todos os direitos reservados.</span>
            <span>Camama · Luanda · Angola</span>
          </div>
        </div>
      </footer>

      {/* Botões flutuantes */}
      <div className="site-floats">
        <a href={IG_URL} target="_blank" rel="noopener" className="site-float site-float-ig"><Ic.insta s={20}/></a>

    </div>
  );

function ChangeMyPassword({ user, onClose }){
  const [oldp, setOldp] = React.useState('');
  const [n1, setN1] = React.useState('');
  const [n2, setN2] = React.useState('');
  const [show, setShow] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [ok, setOk] = React.useState(false);
  function save(){
    const me = getUsers().find(u => u.email === user.email);
    if (!me || me.pass !== oldp){ setMsg('Senha atual incorreta.'); return; }
    if (n1.length < 3){ setMsg('A nova senha é demasiado curta (mín. 3).'); return; }
    if (n1 !== n2){ setMsg('A confirmação não coincide.'); return; }
    setUsers(getUsers().map(u => u.email === user.email ? { ...u, pass: n1 } : u));
    setOk(true); setMsg('Senha alterada com sucesso ✓');
    setTimeout(onClose, 1100);
  }
  return (
    <div className="pw-modal-bg" onClick={onClose}>
      <div className="pw-modal" onClick={e => e.stopPropagation()}>
        <div className="pw-modal-h">
          <span className="survey-embed-ic"><Ic.lock s={16}/></span>
          <div style={{ minWidth: 0 }}><strong>Alterar a minha senha</strong><span>{user.email}</span></div>
        </div>
        <span className="login-lbl">Senha atual</span>
        <input className="bsp-input" type={show ? 'text' : 'password'} value={oldp} autoFocus onChange={e => { setOldp(e.target.value); setMsg(''); }} style={{ marginBottom: 10 }}/>
        <span className="login-lbl">Nova senha</span>
        <input className="bsp-input" type={show ? 'text' : 'password'} value={n1} onChange={e => { setN1(e.target.value); setMsg(''); }} style={{ marginBottom: 10 }}/>
        <span className="login-lbl">Confirmar nova senha</span>
        <input className="bsp-input" type={show ? 'text' : 'password'} value={n2} onChange={e => { setN2(e.target.value); setMsg(''); }} style={{ marginBottom: 12 }}/>
        <label style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 12.5, color: 'var(--bsp-text2)', marginBottom: 14, cursor: 'pointer' }}><input type="checkbox" checked={show} onChange={e => setShow(e.target.checked)}/> Mostrar senhas</label>
        {msg && <div className={ok ? 'pw-ok' : 'login-err'} style={{ marginBottom: 12 }}>{ok ? <Ic.check s={13}/> : <Ic.lock s={13}/>} {msg}</div>}
        <div style={{ display: 'flex', gap: 10 }}>
          <Btn kind="primary" className="bsp-fullw" onClick={save}>Guardar nova senha</Btn>
          <Btn kind="ghostnavy" onClick={onClose}>Cancelar</Btn>
        </div>
      </div>
    </div>
  );
}

function PortalScreen({ user, onBack, onLogout, onOpen }){
  const dests = PORTAL_DESTS.filter(d => can(user, d.perm));
  const firstName = (user.nome || '').split(' ')[0];
  const [showPw, setShowPw] = React.useState(false);
  return (
    <div className="portal-screen">
      {showPw && <ChangeMyPassword user={user} onClose={() => setShowPw(false)}/>}
      <div className="portal-brand">
        <div className="portal-brand-bggrid"/>
        <div className="portal-brand-glow"/>
        <div style={{ position: 'relative', zIndex: 2, display: 'flex', justifyContent: 'space-between', gap: 10 }}>
          <button className="portal-back" onClick={onBack}><Ic.arrow s={15} style={{ transform: 'rotate(180deg)' }}/> Voltar ao site</button>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="portal-back" onClick={() => setShowPw(true)}><Ic.lock s={13}/> Alterar senha</button>
            <button className="portal-back" onClick={onLogout}><Ic.lock s={13}/> Terminar sessão</button>
          </div>
        </div>
        <div style={{ position: 'relative', zIndex: 2 }}>
          <BarispolLogo mono size={56} fs={20}/>
          <span className="portal-tag"><Ic.lock s={12}/> {ROLES[user.role].label}</span>
          <h2>Olá, {firstName}.<br/><span>O que vamos fazer hoje?</span></h2>
          <p>Tem acesso a {dests.length} {dests.length === 1 ? 'plataforma' : 'plataformas'}. Selecione abaixo para continuar.</p>
        </div>
        <div style={{ position: 'relative', zIndex: 2, fontSize: 12, color: 'rgba(255,255,255,.5)', display: 'flex', alignItems: 'center', gap: 7 }}><Ic.shield s={14}/> Sessão segura · {user.email}</div>
      </div>
      <div className="portal-list-panel">
        <h3>As suas ferramentas</h3>
        <p className="portal-list-sub">Acesso definido pelo seu perfil de colaborador.</p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
          {dests.map(d => (
            <button key={d.id} className="portal-dest" onClick={() => onOpen(d.id)}>
              <span className="portal-dest-ic" data-admin={d.id === 'admin'}><PIcon k={d.icon}/></span>
              <span style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                <span className="portal-dest-top">
                  <span className="portal-dest-name">{d.nome}</span>
                  <span className="portal-dest-tag">{d.tag}</span>
                  {d.ext && <span className="portal-dest-ext"><Ic.ext s={12}/> nova aba</span>}
                </span>
                <span className="portal-dest-desc">{d.desc}</span>
                <span className="portal-dest-pts">{d.pontos.map(p => <span key={p}><Ic.check s={12}/> {p}</span>)}</span>
              </span>
              <span className="portal-dest-go">{d.ext ? <Ic.ext s={18}/> : <Ic.arrow s={18}/>}</span>
            </button>
          ))}
        </div>
        <div className="portal-foot"><span>Problemas a aceder?</span><a href="https://wa.me/244946373631" target="_blank" rel="noopener">Contactar TI →</a></div>
      </div>
    </div>
  );
}

function GestorScreen({ onBack }){
  return (
    <div style={{ minHeight: '100vh', background: 'var(--bsp-bg)' }}>
      <div className="gestor-topnav">
        <button className="portal-back" style={{ color: 'var(--bsp-navy)', background: 'var(--bsp-surface2)', border: '1px solid var(--bsp-border)' }} onClick={onBack}><Ic.arrow s={15} style={{ transform: 'rotate(180deg)' }}/> Voltar ao portal</button>
        <BarispolLogo size={36} fs={15}/>
        <span style={{ width: 140 }}/>
      </div>
      <ContentManager/>
    </div>
  );
}

const MS_FORMS_RESULTS = 'https://forms.office.com/';

function Main(){
  const [screen, setScreen] = React.useState('site'); // site|login|portal|gestor|admin
  const [user, setUser] = React.useState(null);

  const go = (s) => { setScreen(s); window.scrollTo(0,0); };
  const enterReserved = () => go('login');   // mostra sempre o login p/ escolher a conta
  const onLogin = (u) => { setUser(u); go('portal'); };
  const logout = () => { setSession(null); setUser(null); go('login'); };
  const openDest = (id) => {
    if (id === 'meta') window.open(METAGEST_URL, '_blank', 'noopener');
    else if (id === 'work') window.open(WORKSPACE_FILE, '_blank');
    else if (id === 'cms') go('gestor');
    else if (id === 'survey') window.open(MS_FORMS_RESULTS, '_blank', 'noopener');
    else if (id === 'admin') go('admin');
  };

  if (screen === 'login')  return <LoginScreen onSuccess={onLogin} onBack={() => go('site')} onMeta={() => window.open(METAGEST_URL, '_blank', 'noopener')}/>;
  if (screen === 'portal' && user) return <PortalScreen user={user} onBack={() => go('site')} onLogout={logout} onOpen={openDest}/>;
  if (screen === 'gestor' && user && can(user,'cms')) return <GestorScreen onBack={() => go('portal')}/>;
  if (screen === 'admin' && user && can(user,'admin')) return <AdminUsers currentUser={user} onBack={() => go('portal')}/>;
  return <PublicSite onReserved={enterReserved} heroImg={SITE_IMG}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Main/>);
</script>
</body>
</html>
