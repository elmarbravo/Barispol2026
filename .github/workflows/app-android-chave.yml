# Gera a chave com que a app e assinada para a Play Store. UMA VEZ.
#
# ANTES de correr: Settings -> Secrets and variables -> Actions ->
# New repository secret -> nome ANDROID_KEYSTORE_PASSWORD, valor uma frase
# longa (16 caracteres ou mais) que fique guardada em lugar seguro.
#
# A chave fica CIFRADA dentro do repositorio, em
# app/android/chave-de-envio.keystore.enc, e so se abre com essa frase. E
# assim de proposito: o repositorio e publico, e mesmo assim a chave nao se
# le sem a frase; e nunca ninguem tem de descarregar nem colar ficheiros.
#
# Se a frase se perder, a chave perde-se com ela. Nesse caso a Play Store
# permite pedir uma nova chave de envio (Play App Signing), mas leva dias.

name: App Android · gerar chave (uma vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chave:
    name: Gerar e guardar cifrada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Recusar se já existir
        run: |
          if [ -f app/android/chave-de-envio.keystore.enc ]; then
            echo "::error title=Já existe uma chave::Gerar outra invalidaria as actualizações da app já publicada. Se quer mesmo substituí-la, apague primeiro app/android/chave-de-envio.keystore.enc."
            exit 1
          fi

      - name: Verificar a frase
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error title=Falta o segredo::Crie o segredo ANDROID_KEYSTORE_PASSWORD em Settings -> Secrets and variables -> Actions, e volte a correr."
            exit 1
          fi
          if [ "${#PW}" -lt 16 ]; then
            echo "::error title=Frase demasiado curta::A frase tem de ter pelo menos 16 caracteres. É ela que protege a chave num repositório público."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar a chave
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/chave-de-envio.keystore" \
            -alias barispol -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Centro Medico Barispol, O=Centro Medico Barispol, L=Luanda, C=AO"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$RUNNER_TEMP/chave-de-envio.keystore" \
            -out app/android/chave-de-envio.keystore.enc -pass env:PW
          keytool -list -v -keystore "$RUNNER_TEMP/chave-de-envio.keystore" -storepass "$PW" \
            | grep -E "SHA1:|SHA256:" > app/android/chave-de-envio.impressoes.txt
          rm -f "$RUNNER_TEMP/chave-de-envio.keystore"
          echo "::notice title=Chave gerada::Ficou cifrada em app/android/chave-de-envio.keystore.enc. As impressões digitais (públicas) estão ao lado."

      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android/chave-de-envio.keystore.enc app/android/chave-de-envio.impressoes.txt
          git commit -m "App Android: chave de envio, cifrada"
          git push
