<style id="bsp-responsive">
  body[data-mobile="true"] main { overflow-y: auto !important; overflow-x: hidden !important; -webkit-overflow-scrolling: touch; padding: 12px 12px 84px !important; }
  body[data-mobile="true"] main > div { height: auto !important; min-height: 0 !important; overflow: visible !important; }
  body[data-mobile="true"] .bsp-stack-mobile { grid-template-columns: 1fr !important; }
  body[data-mobile="true"] .bsp-hide-mobile { display: none !important; }
  .bsp-mnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: none;
    background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(15,23,42,.06);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  body[data-mobile="true"] .bsp-mnav { display: grid; grid-template-columns: repeat(5, 1fr); }
  .bsp-mnav button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none;
    padding: 6px 0; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600; color: var(--text-3); }
  .bsp-mnav button[data-on="true"] { color: var(--accent-d); }
  .bsp-mdrawer-back { position: fixed; inset: 0; z-index: 950; background: rgba(15,23,42,.5); display: flex; align-items: flex-end; }
  .bsp-mdrawer { width: 100%; background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 12px calc(16px + env(safe-area-inset-bottom)); }
  .bsp-msg-row:hover .bsp-msg-del { opacity: 1 !important; }
  body[data-mobile="true"] .bsp-msg-del { opacity: 1 !important; }
  .bsp-taskdel { opacity: 0; transition: opacity .15s; }
  .bsp-taskcard:hover .bsp-taskdel { opacity: 1; }
  body[data-mobile="true"] .bsp-taskdel { opacity: 1; }
  body[data-mobile="true"] .bsp-taskboard { grid-template-columns: 1fr !important; gap: 12px !important; }
  body[data-mobile="true"] .bsp-cal-body { grid-template-columns: 1fr !important; }
  body[data-mobile="true"] .bsp-login-root { grid-template-columns: 1fr !important; }
  body[data-mobile="true"] .bsp-login-brand { display: none !important; }
  body[data-mobile="true"] .bsp-login-formwrap { padding: 24px 18px !important; align-items: flex-start !important; }
  body[data-mobile="true"] .bsp-login-mlogo { display: flex !important; }
  body[data-mobile="true"] .bsp-drive-grid { grid-template-columns: 1fr 1fr !important; }
  .bsp-evtdel { opacity: 0; transition: opacity .15s; }
  .bsp-evt:hover .bsp-evtdel { opacity: 1; }
  body[data-mobile="true"] .bsp-evtdel { opacity: 1; }

  /* ── Correcções de dimensões no telemóvel ─────────────────────────────
     No ecrã estreito o conteúdo tinha de mandar na largura; era o cromo à
     volta que estava a mandar. */

  /* Os botões de acção da mensagem são sempre visíveis no telemóvel, por
     não haver rato. Como irmãos do texto, roubavam-lhe metade da largura:
     passam para o canto superior direito da linha, sobrepostos. */
  .bsp-msg-row { position: relative; }
  body[data-mobile="true"] .bsp-msg-acts {
    position: absolute; top: -2px; right: 0; z-index: 2;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1px 2px; }
  body[data-mobile="true"] .bsp-msg-row > div:last-child { padding-right: 0; }

  /* A caixa de escrita ocupava quase metade do ecrã: a barra de formatação
     e a legenda das teclas não fazem sentido num telemóvel. */
  body[data-mobile="true"] .bsp-composer-tools { display: none !important; }
  body[data-mobile="true"] .bsp-composer-hint { display: none !important; }

  /* Grelhas de duas e três colunas que ficavam ilegíveis ao encolher. */
  body[data-mobile="true"] .bsp-grid2,
  body[data-mobile="true"] .bsp-grid3 { grid-template-columns: 1fr !important; }

  /* Tabelas de seis colunas ao telemóvel.

     Troca o modo de disposição em vez de tentar reescrever as colunas da
     grelha: com display:flex a grid-template-columns fica inerte, e a
     regra não depende de vencer o estilo inline campo a campo.

     Fica quem é a pessoa numa linha inteira, e por baixo o que se pode
     fazer com ela. Cargo, departamento, e-mail e aniversário saem: são
     seis colunas num ecrã de quatro palavras, e vêem-se ao abrir a ficha.

     Admin      1 Utilizador 2 Cargo 3 Departamento 4 Acesso 5 Aniversário 6 acções
     Directório 1 Nome       2 Cargo 3 Departamento 4 E-mail 5 Estado      6 acções */
  body[data-mobile="true"] .bsp-tabela,
  body[data-mobile="true"] .bsp-admin-row {
    display: flex !important; flex-wrap: wrap; align-items: center;
    gap: 8px !important; padding: 12px 14px !important; }
  body[data-mobile="true"] .bsp-tabela > *:first-child,
  body[data-mobile="true"] .bsp-admin-row > *:first-child {
    flex: 1 1 100%; min-width: 0; }
  body[data-mobile="true"] .bsp-tabela > *:nth-child(6),
  body[data-mobile="true"] .bsp-admin-row > *:nth-child(6) {
    flex: none; margin-left: auto; }
  body[data-mobile="true"] .bsp-admin-row > *:nth-child(2),
  body[data-mobile="true"] .bsp-admin-row > *:nth-child(3),
  body[data-mobile="true"] .bsp-admin-row > *:nth-child(5),
  body[data-mobile="true"] .bsp-tabela > *:nth-child(2),
  body[data-mobile="true"] .bsp-tabela > *:nth-child(3),
  body[data-mobile="true"] .bsp-tabela > *:nth-child(4) {
    display: none !important; }
  body[data-mobile="true"] .bsp-tabela-cab { display: none !important; }

  /* A linha do seguimento: nome em cima, acções por baixo, encostadas à
     direita. Duas colunas num ecrã estreito deixavam o nome sem espaço. */
  body[data-mobile="true"] .bsp-seg-linha {
    grid-template-columns: 1fr !important; gap: 10px !important; }
  body[data-mobile="true"] .bsp-seg-linha > *:last-child { justify-content: flex-end; }
</style>

<style>
  /* ── Design tokens ──────────────────────────────────────── */
  :root {
    /* Brand */
    --navy: #002060;
    --navy-d: #001340;
    --accent: #00A3E0;
    --accent-d: #0078A6;
    --accent-soft: rgba(0,163,224,.10);

    /* Neutrals (cool tone, OKLCH-derived) */
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --surface-2: #F4F6FB;
    --border: #E2E8F0;

    --text-1: #0F172A;
    --text-2: #475569;
    --text-3: #94A3B8;
  }

  /* "Clínico" variant — slightly cooler surfaces, denser */
  body[data-variant="clinico"] {
    --bg: #EDF1F7;
    --surface-2: #F1F4F9;
    --border: #D9E2EC;
  }
  body[data-variant="arejado"] {
    --bg: #F7F9FC;
    --surface-2: #F4F7FB;
    --border: #E5EAF1;
  }

  body[data-density="compacta"] { font-size: 13.5px; }
  body[data-density="compacta"] .bsp-row-hover,
  body[data-density="compacta"] .bsp-card-hover { padding-block: 2px; }

  * { box-sizing: border-box; }
  html, body, #root {
    margin: 0; padding: 0; height: 100%; width: 100%;
  }
  body {
    font-family: 'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--text-1);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  button, input, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--text-3); }

  /* Scrollbars (subtle) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D9E0EA; border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #B8C2D1; }

  /* Hover utilities */
  .bsp-card-hover { transition: border-color .15s, transform .15s, box-shadow .15s; }
  .bsp-card-hover:hover { border-color: rgba(0,163,224,.4); box-shadow: 0 4px 16px rgba(15,23,42,.06); }

  .bsp-row-hover { transition: background .12s; }
  .bsp-row-hover:hover { background: var(--surface-2); }

  .bsp-iconbtn {
    background: transparent; border: none; cursor: pointer;
    width: 34px; height: 34px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); transition: background .15s, color .15s;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
  }
  .bsp-iconbtn:hover { background: var(--surface-2); color: var(--text-1); }

  .bsp-btn:hover { filter: brightness(.96); }
  .bsp-btn:active { transform: translateY(1px); }

  .bsp-tb:hover { background: var(--surface-2); color: var(--text-1); }

  /* Typing dots */
  .bsp-typing-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-3);
    animation: bsp-typing 1.2s infinite ease-in-out;
  }
  @keyframes bsp-typing {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* Login form shake */
  @keyframes bsp-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Smooth fade transitions on screen swap */
  main > * { animation: bsp-fade .22s ease-out; }
  @keyframes bsp-fade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Anchors */
  a { color: var(--accent-d); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>

/* Níveis da versão anterior, para não deixar ninguém de fora ao actualizar */
const CAMADAS_ANTIGAS = {
  'Super Admin': 'Direcção', 'Admin': 'Coordenação', 'Manager': 'Coordenação',
  'Membro': 'Operações', 'Convidado': 'Operações'
};
/* As camadas deixaram de estar presas ao codigo: o CAMADAS acima e apenas
   o ponto de partida de uma instalacao nova. A versao viva e editavel no
   Admin, vive no estado partilhado e sincroniza pelo Supabase.

   O StoreProvider publica-a em window.__bspCamadas porque estas funcoes
   sao chamadas de fora de componentes React e nao podem ler o estado — e
   o mesmo caminho que o window.CURRENT_USER_ID ja usa. */
function bspCamadas(){
  const vivas = typeof window !== 'undefined' && window.__bspCamadas;
  return (vivas && Object.keys(vivas).length) ? vivas : CAMADAS;
}
/* A camada para onde recai quem tem um nivel que ja nao existe — porque
   foi apagado, ou porque chegou do servidor uma lista sem ele.

   Escolhe SEMPRE de entre as que nao administram nada. Ordenar so pelo
   numero de ordem nao chegava: se a unica camada restante fosse a
   Direccao, quem perdesse a sua herdava a administracao inteira. Um erro
   de dados nunca pode dar permissoes a alguem. */
function bspCamadaBase(){
  const cs = bspCamadas();
  const nomes = Object.keys(cs);
  if (!nomes.length) return 'Operações';
  const porOrdem = nomes.slice().sort((a, b) => (cs[b].ordem || 0) - (cs[a].ordem || 0));
  const inofensivas = porOrdem.filter(x => !cs[x].podeGerirUtilizadores && !cs[x].podeVerSistema);

function bspCamadaNome(u){
  const cs = bspCamadas();
  const n = u && u.accessLevel;
  if (cs[n]) return n;
  const antigo = CAMADAS_ANTIGAS[n];
  if (antigo && cs[antigo]) return antigo;

   administram alguma coisa e alguem ficou sem a sua: nesse caso e melhor
   nao ver nada do que ver tudo. */
const BSP_CAMADA_NULA = {
  ordem: 999,
  desc: 'Sem camada atribuída.',
  canais: [],
  admin: null,
  podeGerirUtilizadores: false,
  podeVerSistema: false
};
function bspCamada(u){
  const cs = bspCamadas();
  return cs[bspCamadaNome(u)] || cs[bspCamadaBase()] || BSP_CAMADA_NULA;
}
function bspVeCanal(u, canal){
  if (!u || !canal) return false;
  /* Grupos privados: só os membros escolhidos. A Direcção vê tudo. */
  if (canal.membros && canal.membros.length) {
    /* Antes era o nome 'Direcção' à letra. Com camadas editáveis isso
       deixaria um administrador de fora só por se chamar outra coisa:
       o que conta é poder ver o sistema, não o nome da camada. */
    if (bspCamada(u).podeVerSistema) return true;
    return canal.membros.indexOf(u.id) !== -1;
  }
  /* Ajustes por pessoa feitos no Admin: retirar ganha a dar, e ambos ganham à camada. */
  if (u.semCanais && u.semCanais.indexOf(canal.id) !== -1) return false;
  if (u.extraCanais && u.extraCanais.indexOf(canal.id) !== -1) return true;
  const c = bspCamada(u);
  if (!c || c.canais === '*') return true;
  return c.canais.indexOf(canal.dept ? canal.dept : null) !== -1;
}

/* ═══ Tarefas pessoais ═══════════════════════════════════════════════════
   As tarefas da equipa vivem no shared_state, que e enviado por inteiro
   para todos os aparelhos. Uma tarefa marcada "pessoal" e apenas escondida
   no ecra continuaria a chegar a toda a gente — privacidade a fingir.

   Estas vivem numa tabela propria onde a regra do servidor so deixa cada
   pessoa ler as suas. Nem sequer chegam ao aparelho dos outros. */

function useTarefasPessoais() {
  const [tarefas, setTarefas] = React.useState([]);
  const [estado, setEstado] = React.useState('inicio');
  const [tick, setTick] = React.useState(0);
  const recarregar = React.useCallback(() => setTick(t => t + 1), []);

  React.useEffect(() => {
    const cl = bspGetClient();
    if (!cl) { setEstado('sem-servidor'); return; }
    let vivo = true;
    setEstado('a-carregar');
    (async () => {
      try {
        const r = await cl.from('tarefas_pessoais').select('*')
          .order('ordem', { ascending: true })
          .order('created_at', { ascending: true });
        if (!vivo) return;
        if (r.error) {
          setEstado(/relation|does not exist|schema cache/i.test(r.error.message || '') ? 'sem-tabela' : 'erro');
          return;
        }
        /* O RLS ja limita as linhas ao dono; nao ha nada a filtrar aqui. */
        setTarefas(r.data || []);
        setEstado('pronto');
      } catch (e) {
        if (vivo) setEstado('erro');
      }
    })();
    return () => { vivo = false; };
  }, [tick]);

  const criar = React.useCallback(async (coluna, dados) => {
    const cl = bspGetClient();
    if (!cl) return 'O servidor não está ligado.';
    const r = await cl.from('tarefas_pessoais').insert({
      user_id: window.CURRENT_USER_ID || null,
      coluna: coluna,
      titulo: dados.title,
      prioridade: dados.priority || 'media',
      prazo: dados.due || null,
      ordem: Date.now() % 2000000000
    });
    if (r && r.error) return r.error.message || 'Não foi possível gravar.';
    recarregar();
    return null;
  }, [recarregar]);

  const mover = React.useCallback(async (id, coluna) => {
    const cl = bspGetClient();
    if (!cl) return;
    await cl.from('tarefas_pessoais').update({ coluna: coluna }).eq('id', id);
    recarregar();
  }, [recarregar]);

  const apagar = React.useCallback(async id => {
    const cl = bspGetClient();
    if (!cl) return;
    await cl.from('tarefas_pessoais').delete().eq('id', id);
    recarregar();
  }, [recarregar]);

  /* Devolve no mesmo formato do quadro da equipa, para o ecra tratar as
     duas origens da mesma maneira. */
  const porColuna = React.useMemo(() => {
    const b = { todo: [], doing: [], review: [], done: [] };
    tarefas.forEach(t => {
      const c = b[t.coluna] ? t.coluna : 'todo';
      b[c].push({
        id: 'p' + t.id,
        idReal: t.id,
        pessoal: true,
        title: t.titulo,
        priority: t.prioridade,
        due: t.prazo || '',
        assignees: [],
        tags: [],
        proj: ''
      });
    });
    return b;
  }, [tarefas]);

  return { porColuna, estado, criar, mover, apagar, recarregar };
}

/* Leitor de CSV para os relatorios do MetaGest.

   Escrito a mao em vez de trazer uma biblioteca: o site nao tem passo de
   compilacao, e uma folha de calculo custaria quase um megabyte para
   fazer o que cabe em cinquenta linhas.

   Aguenta o que o Excel portugues produz de facto: ponto-e-virgula como
   separador, BOM no inicio, campos entre aspas com separadores e quebras
   de linha la dentro, aspas duplicadas para escapar aspas, e fins de
   linha do Windows. */

function bspDetectarSeparador(texto) {
  /* Conta cada candidato FORA de aspas, na primeira linha util. Contar em
     todo o ficheiro enganava-se com nomes tipo "Silva, Maria". */
  const cands = [';', ',', '\t', '|'];
  const conta = {};
  cands.forEach(c => conta[c] = 0);
  let dentro = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (ch === '"') {
      if (dentro && texto[i + 1] === '"') { i++; continue; }
      dentro = !dentro;
      continue;
    }
    if (dentro) continue;
    if (ch === '\n') break;
    if (ch in conta) conta[ch]++;
  }
  let melhor = ';', max = -1;
  cands.forEach(c => {
    if (conta[c] > max) { max = conta[c]; melhor = c; }
  });
  return max > 0 ? melhor : ';';
}

function bspLerCsv(texto) {
  if (typeof texto !== 'string' || !texto.trim()) return { cabecalho: [], linhas: [] };
  /* O BOM do Excel apareceria colado ao primeiro cabecalho. */
  if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
  const sep = bspDetectarSeparador(texto);

  const linhas = [];
  let campo = '';
  let linha = [];
  let dentro = false;

  const fecharCampo = () => { linha.push(campo.trim()); campo = ''; };
  const fecharLinha = () => {
    fecharCampo();
    /* Linhas totalmente vazias nao contam — o Excel deixa-as no fim. */
    if (linha.some(c => c !== '')) linhas.push(linha);
    linha = [];
  };

  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (dentro) {
      if (ch === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }
        else dentro = false;
      } else campo += ch;
      continue;
    }
    if (ch === '"') { dentro = true; continue; }
    if (ch === sep) { fecharCampo(); continue; }
    if (ch === '\r') continue;
    if (ch === '\n') { fecharLinha(); continue; }
    campo += ch;
  }
  if (campo !== '' || linha.length) fecharLinha();

  if (!linhas.length) return { cabecalho: [], linhas: [], sep: sep };
  const cabecalho = linhas[0].map((c, i) => c || ('Coluna ' + (i + 1)));
  return { cabecalho: cabecalho, linhas: linhas.slice(1), sep: sep };
}

/* Datas: o MetaGest e o Excel portugues escrevem dd/mm/aaaa; o ISO tambem
   aparece. Devolve aaaa-mm-dd, ou null se nao for data nenhuma. */
function bspLerData(v) {
  const s = String(v || '').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return bspDataValida(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let ano = +m[3];
    if (ano < 100) ano += ano < 70 ? 2000 : 1900;
    return bspDataValida(ano, +m[2], +m[1]);
  }
  return null;
}

function bspDataValida(a, m, d) {
  if (!(a >= 1900 && a <= 2200) || !(m >= 1 && m <= 12) || !(d >= 1 && d <= 31)) return null;
  const dt = new Date(Date.UTC(a, m - 1, d));
  /* Apanha 31/02 e afins, que o Date acomoda em silencio. */
  if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return a + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* Chave estavel do utente, para nao duplicar a cada importacao. O nome sem
   acentos nem pontuacao, mais os digitos do telefone quando existe. */
function bspChaveUtente(nome, telefone) {
  const n = String(nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
  const t = String(telefone || '').replace(/\D/g, '').replace(/^244/, '');
  if (!n) return null;
  return t ? n + '|' + t : n;
}

/* ═══ Seguimento e retorno ══════════════════════════════════════════════
   Quem esteve na clinica e nao voltou.

   O MetaGest continua a ser a verdade sobre consultas e facturacao. Este
   modulo nao a duplica: importa de la quem veio e quando, e guarda so o
   que a clinica fez desde entao para o trazer de volta.

   Vive em tabelas proprias (utentes, seguimentos) e nao no shared_state,
   que e um unico bloco JSON reescrito por inteiro a cada alteracao —
   serve para dezenas de linhas, nao para milhares de utentes. */

const BSP_ESTADOS = [
  { id: 'por-contactar', nome: 'Por contactar', cor: '#B54708', fundo: 'rgba(181,71,8,.10)' },
  { id: 'contactado',    nome: 'Contactado',    cor: '#14448F', fundo: 'rgba(20,68,143,.10)' },
  { id: 'marcado',       nome: 'Marcado',       cor: '#06713F', fundo: 'rgba(6,113,63,.10)' },
  { id: 'voltou',        nome: 'Voltou',        cor: '#06713F', fundo: 'rgba(6,113,63,.16)' },
  { id: 'dispensado',    nome: 'Não insistir',  cor: '#64748B', fundo: 'rgba(100,116,139,.12)' }
];
const bspEstado = id => BSP_ESTADOS.find(e => e.id === id) || BSP_ESTADOS[0];

/* Dias desde uma data em aaaa-mm-dd, contados em UTC para o resultado nao
   mudar consoante a hora a que se abre a pagina. */
function bspDiasDesde(iso) {
  if (!iso) return null;
  const p = String(iso).slice(0, 10).split('-');
  if (p.length !== 3) return null;
  const d = Date.UTC(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d)) return null;
  const hoje = new Date();
  const h = Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return Math.floor((h - d) / 86400000);
}

function bspHaQuanto(dias) {
  if (dias === null) return 'sem registo';
  if (dias <= 0) return 'hoje';
  if (dias === 1) return 'ontem';
  if (dias < 30) return 'há ' + dias + ' dias';
  const m = Math.floor(dias / 30);
  if (m < 12) return 'há ' + m + (m === 1 ? ' mês' : ' meses');
  const a = Math.floor(dias / 365);
  return 'há ' + a + (a === 1 ? ' ano' : ' anos');
}

/* Carrega os utentes que nao vem ha mais de `meses`, com o estado de
   seguimento mais recente de cada um. */
function useSeguimento(meses) {
  const [linhas, setLinhas] = React.useState([]);
  const [estado, setEstado] = React.useState('inicio');
  const [erro, setErro] = React.useState('');
  const [tick, setTick] = React.useState(0);
  const recarregar = React.useCallback(() => setTick(t => t + 1), []);

  React.useEffect(() => {
    const cl = bspGetClient();
    if (!cl) {
      setEstado('sem-servidor');
      return;
    }
    let vivo = true;
    setEstado('a-carregar');
    setErro('');
    (async () => {
      try {
        const corte = new Date();
        corte.setMonth(corte.getMonth() - meses);
        const limite = corte.toISOString().slice(0, 10);

        const u = await cl.from('utentes').select('*')
          .lte('ultima_visita', limite)
          .order('ultima_visita', { ascending: true })
          .limit(600);
        if (!vivo) return;
        if (u.error) {
          /* A tabela pode ainda nao existir: dizer isso, e nao um erro cru. */
          setEstado(/relation|does not exist|schema cache/i.test(u.error.message || '') ? 'sem-tabelas' : 'erro');
          setErro(u.error.message || '');
          return;
        }
        const utentes = u.data || [];
        if (!utentes.length) {
          setLinhas([]);
          setEstado('pronto');
          return;
        }
        /* Todo o historico dos utentes trazidos, reduzido ao mais recente
           de cada um. Uma consulta em vez de uma por pessoa. */
        const s = await cl.from('seguimentos').select('*')
          .in('utente_id', utentes.map(x => x.id))
          .order('created_at', { ascending: false });
        if (!vivo) return;
        const ultimo = {};
        (s.data || []).forEach(r => {
          if (!ultimo[r.utente_id]) ultimo[r.utente_id] = r;
        });
        setLinhas(utentes.map(x => ({
          ...x,
          dias: bspDiasDesde(x.ultima_visita),
          seg: ultimo[x.id] || null
        })));
        setEstado('pronto');
      } catch (e) {
        if (!vivo) return;
        setEstado('erro');
        setErro(e && e.message || 'Falha a carregar.');
      }
    })();
    return () => { vivo = false; };
  }, [meses, tick]);

  return { linhas, estado, erro, recarregar };
}

/* Regista uma accao de seguimento. Historico, nao estado: a linha nova
   passa a ser a verdade, e as anteriores ficam para se saber o percurso. */
async function bspRegistarSeguimento(utenteId, estado, nota) {
  const cl = bspGetClient();
  if (!cl) return 'O servidor não está ligado.';
  const r = await cl.from('seguimentos').insert({
    utente_id: utenteId,
    estado: estado,
    nota: (nota || '').trim() || null,
    user_id: window.CURRENT_USER_ID || null
  });
  return r && r.error ? (r.error.message || 'Não foi possível gravar.') : null;
}

/* ── Importacao do relatorio do MetaGest ──────────────────────────────
   Os nomes das colunas nao estao fixos aqui de proposito: o relatorio
   pode mudar, e adivinhar cabecalhos e' a maneira certa de partir isto no
   primeiro ficheiro real. A pessoa aponta as colunas uma vez e fica
   guardado. */

const BSP_CAMPOS_IMPORT = [
  { id: 'data',     nome: 'Data da visita',  obrig: true,  dicas: ['data de postagem', 'data', 'postagem'] },
  { id: 'nome',     nome: 'Nome do utente',  obrig: true,  dicas: ['nome do utente', 'utente', 'paciente', 'nome'] },
  { id: 'telefone', nome: 'Telefone',        obrig: false, dicas: ['telefone', 'telemovel', 'contacto', 'tel'] },
  { id: 'servico',  nome: 'Serviço',         obrig: false, dicas: ['servico', 'exame', 'descricao', 'artigo'] },
  { id: 'medico',   nome: 'Médico',          obrig: false, dicas: ['medico', 'profissional', 'prestador'] }
];

/* Proposta inicial de correspondencia, por semelhanca do cabecalho. Serve
   para poupar cliques; quem importa confirma sempre. */
function bspAdivinharColunas(cabecalho) {
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const cols = cabecalho.map(norm);
  const escolha = {};
  BSP_CAMPOS_IMPORT.forEach(c => {
    let i = cols.findIndex(h => c.dicas.some(d => h === d));
    if (i < 0) i = cols.findIndex(h => c.dicas.some(d => h.indexOf(d) !== -1));
    escolha[c.id] = i >= 0 ? i : -1;
  });
  return escolha;
}

/* Transforma as linhas do relatorio em utentes: uma linha por pessoa, com
   a visita MAIS RECENTE e quantas vezes apareceu. O relatorio tem uma
   linha por acto, nao por pessoa. */
function bspAgruparUtentes(linhas, mapa) {
  const porChave = {};
  let semData = 0, semNome = 0;
  linhas.forEach(l => {
    const nome = mapa.nome >= 0 ? String(l[mapa.nome] || '').trim() : '';
    const tel = mapa.telefone >= 0 ? String(l[mapa.telefone] || '').trim() : '';
    const data = mapa.data >= 0 ? bspLerData(l[mapa.data]) : null;
    /* A skill do mapa de pagamentos avisa: as linhas sem data de postagem
       sao a linha-fantasma de totais do MetaGest. */
    if (!data) { semData++; return; }
    const chave = bspChaveUtente(nome, tel);
    if (!chave) { semNome++; return; }
    const anterior = porChave[chave];
    const registo = {
      chave: chave,
      nome: nome,
      telefone: tel || (anterior && anterior.telefone) || '',
      ultima_visita: data,
      ultimo_servico: mapa.servico >= 0 ? String(l[mapa.servico] || '').trim() : '',
      ultimo_medico: mapa.medico >= 0 ? String(l[mapa.medico] || '').trim() : '',
      visitas: 1
    };
    if (!anterior) { porChave[chave] = registo; return; }
    anterior.visitas++;
    if (!anterior.telefone && registo.telefone) anterior.telefone = registo.telefone;
    /* So a visita mais recente manda nos campos "ultimo". */
    if (data > anterior.ultima_visita) {
      anterior.ultima_visita = data;
      anterior.ultimo_servico = registo.ultimo_servico;
      anterior.ultimo_medico = registo.ultimo_medico;
      anterior.nome = nome;
    }
  });
  return { utentes: Object.values(porChave), semData: semData, semNome: semNome };
}

/* Envia em lotes: um upsert de milhares de linhas de uma vez costuma
   morrer a meio, e a chave unica deixa repetir sem duplicar. */
async function bspImportarUtentes(utentes, aoProgresso) {
  const cl = bspGetClient();
  if (!cl) return { erro: 'O servidor não está ligado.' };
  const LOTE = 200;
  let feitos = 0;
  for (let i = 0; i < utentes.length; i += LOTE) {
    const parte = utentes.slice(i, i + LOTE).map(u => ({
      ...u,
      actualizado_em: new Date().toISOString()
    }));
    const r = await cl.from('utentes').upsert(parte, { onConflict: 'chave' });
    if (r && r.error) {
      if (/relation|does not exist|schema cache/i.test(r.error.message || '')) {
        return { erro: 'As tabelas ainda não existem no servidor. Corra o crm-seguimento.sql uma vez no Supabase.' };
      }
      return { erro: r.error.message || 'O servidor recusou a importação.', feitos: feitos };
    }
    feitos += parte.length;
    if (aoProgresso) aoProgresso(feitos, utentes.length);
  }
  return { feitos: feitos };
}

  }, [open]);

    const f = (e.target.files || [])[0];
    if (!f) return;
    setErro(''); setFicheiro(f);

      setErro('Este ficheiro é do Excel. No MetaGest, exporte o relatório como CSV — é a mesma informação, e evita trazer para dentro do site uma biblioteca de folhas de cálculo inteira.');

      let guardado = null;

    if (r.erro) { setErro(r.erro); return; }

    onClose();

    open: open, onClose: onClose, title: 'Importar do MetaGest', width: 620
  }, React.createElement("div", {
    style: { padding: 20, display: 'flex', flexDirection: 'column', gap: 14 }
  },
  erro && React.createElement("div", {
    style: {
      background: 'rgba(220,38,38,.08)', border: '1px solid rgba(220,38,38,.35)',
      borderLeft: '3px solid #DC2626', borderRadius: 8, padding: '10px 12px',
      fontSize: 12.5, lineHeight: 1.5, color: 'var(--text-1)'
    }
  }, erro),

  React.createElement("p", {

  }, "No MetaGest, exporte o ", React.createElement("strong", null, "Relatório para o Dashboard"),
     " em CSV e escolha-o aqui. Nada é apagado: quem já cá está é actualizado, e a mesma importação pode correr as vezes que forem precisas."),

  React.createElement("input", {
    ref: inputRef, type: "file", accept: ".csv,text/csv", onChange: escolher,
    style: { display: 'none' }
  }),
  React.createElement(Button, {

    icon: React.createElement(I.Upload, { size: 13 }),
    onClick: () => inputRef.current && inputRef.current.click()
  }, ficheiro ? ficheiro.name : 'Escolher o ficheiro CSV'),

    React.createElement("div", {

    React.createElement("p", {

    }, dados.linhas.length + " linhas, " + dados.cabecalho.length + " colunas. Confirme a correspondência — fica guardada para a próxima."),
